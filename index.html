<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ Tiện ích - PhongNH</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --primary-color: #2563eb;
            --border-color: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-color: var(--primary-color);
        }

        .card h3 {
            margin: 0 0 8px 0;
            font-size: 1.15rem;
            color: var(--primary-color);
        }

        .card p {
            margin: 0;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .loading, .error {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Bộ Sưu Tập Tiện Ích</h1>
            <p class="subtitle">Danh sách các công cụ trực tuyến được phát triển bởi PhongNH</p>
        </header>

        <main>
            <div id="tool-grid" class="grid">
                <div class="loading">Đang tải danh sách công cụ...</div>
            </div>
        </main>
    </div>

    <script>
        async function loadTools() {
            // Thay đổi đúng tên tài khoản và tên repository của bạn ở đây
            const repo = "phongnh243898/websites";
            const url = `https://api.github.com/repos/${repo}/contents/pages`;
            const gridEl = document.getElementById('tool-grid');
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Không thể kết nối tới kho lưu trữ");
                
                const data = await response.json();
                
                // Lọc lấy các thư mục con bên trong thư mục pages/
                const folders = data.filter(item => item.type === "dir");
                
                if (folders.length === 0) {
                    gridEl.innerHTML = `<div class="loading">Chưa có công cụ nào trong thư mục pages/.</div>`;
                    return;
                }
                
                gridEl.innerHTML = '';
                
                folders.forEach(folder => {
                    // Biến đổi tên thư mục thành tiêu đề hiển thị đẹp hơn (Ví dụ: convert_image_to_pdf -> Convert Image To Pdf)
                    const formattedName = folder.name
                        .replace(/[-_]/g, ' ')
                        .replace(/\b\w/g, c => c.toUpperCase());
                    
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = `./pages/${folder.name}/`;
                    
                    card.innerHTML = `
                        <div>
                            <h3>${formattedName}</h3>
                            <p>Truy cập ứng dụng ${formattedName}</p>
                        </div>
                    `;
                    
                    gridEl.appendChild(card);
                });

            } catch (error) {
                console.error("Lỗi:", error);
                gridEl.innerHTML = `<div class="error">Không thể tải danh sách công cụ tự động. Vui lòng kiểm tra lại kết nối hoặc cấu hình API.</div>`;
            }
        }

        loadTools();
    </script>

</body>
</html>
