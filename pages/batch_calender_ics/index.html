<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lịch 12 tháng với lịch Dương, lịch Âm và quản lý sự kiện ICS.">
    <title>Calender ICS</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="app">
        <header class="topbar">
            <a class="brand" href="../../" aria-label="Về trang chủ">
                <span class="brand-icon">C</span>
                <span>Calender <b>ICS</b></span>
            </a>
        </header>

        <div class="content-layout">
            <section class="calendar-panel" aria-label="Bảng lịch 12 tháng">
                <div class="panel-topline">
                    <div class="calendar-caption">
                        <span class="caption-icon">▦</span>
                        <div><strong>Bảng lịch 12 tháng <span id="introYear"></span></strong><small>Thứ 2 là ngày đầu tuần</small></div>
                    </div>
                    <div class="calendar-controls">
                        <div class="calendar-mode" role="group" aria-label="Kiểu lịch">
                            <button class="mode-button is-active" data-calendar="solar" type="button">Dương</button>
                            <button class="mode-button" data-calendar="lunar" type="button">Âm</button>
                        </div>
                        <label class="year-picker">
                            <span>Năm</span>
                            <select id="yearSelect" aria-label="Chọn năm"></select>
                        </label>
                        <button class="button button-outline" id="todayButton" type="button">Hôm nay</button>
                    </div>
                </div>
                <div class="calendar-legend">
                    <span><i class="dot dot-event"></i>Có sự kiện</span>
                    <span><i class="dot dot-selected"></i>Đang chọn</span>
                    <span id="eventCount">0 sự kiện</span>
                </div>
                <div class="months-grid" id="monthsGrid"></div>
            </section>

            <aside class="event-sidebar" aria-label="Cấu hình sự kiện">
                <div class="sidebar-title">
                    <div>
                        <p class="kicker">EVENT EDITOR</p>
                        <h2>Cấu hình sự kiện</h2>
                    </div>
                    <button class="close-editor" id="clearFormButton" type="button" aria-label="Đặt lại biểu mẫu">×</button>
                </div>
                <p class="editor-hint" id="selectionHint">Tạo một sự kiện kéo dài nhiều ngày hoặc chọn sự kiện để chỉnh sửa.</p>

                <form id="eventForm">
                    <label class="field">
                        <span>Tiêu đề <b>*</b></span>
                        <input id="eventTitle" type="text" placeholder="Tên sự kiện" maxlength="120" required>
                    </label>
                    <div class="field-grid">
                        <label class="field">
                            <span>Ngày bắt đầu <b>*</b></span>
                            <input id="eventDate" type="date" required>
                        </label>
                        <label class="field">
                            <span>Ngày kết thúc</span>
                            <input id="eventEndDate" type="date">
                        </label>
                    </div>
                    <div class="field-grid">
                        <label class="field">
                            <span>Giờ bắt đầu <b>*</b></span>
                            <input id="eventStart" type="time" value="09:00" required>
                        </label>
                        <label class="field">
                            <span>Giờ kết thúc <b>*</b></span>
                            <input id="eventEnd" type="time" value="10:00" required>
                        </label>
                    </div>
                    <label class="field">
                        <span>Địa điểm</span>
                        <input id="eventLocation" type="text" placeholder="Thêm địa điểm">
                    </label>
                    <label class="field">
                        <span>Mô tả</span>
                        <textarea id="eventNotes" rows="3" placeholder="Ghi chú cho sự kiện"></textarea>
                    </label>
                    <label class="field">
                        <span>URL</span>
                        <input id="eventUrl" type="url" placeholder="https://...">
                    </label>
                    <div class="form-actions">
                        <button class="button button-primary" type="submit" id="saveEventButton">+ Thêm lịch</button>
                        <button class="button button-delete" type="button" id="deleteEventButton" disabled>Xóa</button>
                    </div>
                </form>

                <div class="events-section">
                    <div class="events-heading">
                        <span>DANH SÁCH SỰ KIỆN</span>
                        <button class="button button-export" id="exportAllButton" type="button">↓ Xuất lịch</button>
                    </div>
                    <div class="event-list" id="eventList">
                        <p class="empty-state">Chưa có sự kiện nào trong năm này.</p>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
</body>
</html>
