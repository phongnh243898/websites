<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Document Scanner & PDF Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg: #f4f4f5;
            --surface: #ffffff;
            --border: #e4e4e7;
            --text: #18181b;
            --muted: #71717a;
            --accent: #18181b;
            --primary: #2563eb;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 10px 14px;
            overflow: hidden;
        }

        svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 1.85;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
            display: block;
        }

        .icon-sm svg {
            width: 14px;
            height: 14px;
        }

        /* [1] HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 14px;
            margin-bottom: 10px;
            gap: 10px;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.05rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        button, .btn-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 7px 12px;
            font-size: 0.83rem;
            font-weight: 500;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }

        button:hover, .btn-label:hover {
            background: #f4f4f5;
        }

        button.btn-dark {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        button.btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none;
        }

        /* [2] MAIN LAYOUT */
        .main-layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        /* DANH SÁCH ẢNH */
        .sidebar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .sidebar-title {
            padding: 9px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .page-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 6px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #fafafa;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
        }

        .page-item.active {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .page-thumb-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .page-index {
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--muted);
            width: 16px;
            text-align: center;
        }

        .page-item img {
            width: 38px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: #fff;
            display: block;
        }

        .page-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .icon-action {
            width: 24px;
            height: 24px;
            padding: 0;
            border: none;
            background: transparent;
            color: var(--muted);
            border-radius: 4px;
        }

        .icon-action:hover:not(:disabled) {
            background: #e4e4e7;
            color: var(--text);
        }

        .icon-action.delete:hover:not(:disabled) {
            background: #fee2e2;
            color: var(--danger);
        }

        /* [3] PREVIEW VIEWPORT */
        .preview-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 460px;
            overflow: hidden;
            position: relative;
        }

        .viewport {
            flex: 1;
            min-height: 400px;
            background: #121214;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        .viewport.panning {
            cursor: grabbing;
        }

        .empty-state {
            color: #71717a;
            font-size: 0.86rem;
            pointer-events: none;
            text-align: center;
            padding: 0 16px;
        }

        .panzoom-stage {
            position: relative;
            transform-origin: center center;
            display: none;
        }

        #editorCanvas {
            display: block;
            max-width: 100%;
            max-height: calc(100dvh - 180px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.55);
        }

        #cropOverlaySvg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        .corner-handle {
            width: 20px;
            height: 20px;
            background: #ffffff;
            border: 3px solid var(--primary);
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: crosshair;
            z-index: 20;
            display: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            touch-action: none;
        }

        .zoom-controls {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            align-items: center;
            gap: 2px;
            background: rgba(24, 24, 27, 0.82);
            backdrop-filter: blur(6px);
            padding: 2px 4px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 25;
        }

        .zoom-controls button {
            width: 24px;
            height: 24px;
            padding: 0;
            background: transparent;
            border: none;
            color: #e4e4e7;
        }

        .zoom-label {
            color: #e4e4e7;
            font-size: 0.72rem;
            min-width: 36px;
            text-align: center;
        }

        /* [4] THANH CÔNG CỤ CHỈNH SỬA GỌN GÀNG */
        .floating-dock {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(24, 24, 27, 0.94);
            backdrop-filter: blur(10px);
            padding: 5px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 6px 20px rgba(0,0,0,0.45);
            z-index: 30;
        }

        .dock-item-group {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .dock-icon-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            color: #e4e4e7;
        }

        .dock-icon-btn svg {
            width: 15px;
            height: 15px;
        }

        .dock-icon-btn:hover {
            background: rgba(255,255,255,0.16);
            color: #fff;
        }

        .dock-icon-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        /* Menu phụ nhỏ gọn vừa khít nội dung */
        .dock-popover {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(24, 24, 27, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 8px;
            padding: 5px 7px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.45);
            width: max-content;
            z-index: 40;
        }

        .dock-popover::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            height: 10px;
        }

        .dock-popover.show {
            display: flex;
        }

        .popover-icon-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dock-popover .dock-icon-btn {
            width: 28px;
            height: 28px;
        }

        .dock-popover .dock-icon-btn svg {
            width: 14px;
            height: 14px;
        }

        .filter-sub-Row {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 5px 2px 1px;
            border-top: 1px solid rgba(255,255,255,0.12);
            color: #e4e4e7;
            font-size: 0.72rem;
            width: 100%;
            justify-content: center;
        }

        .filter-sub-Row.show {
            display: flex;
        }

        .filter-sub-Row input[type="range"] {
            width: 110px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .popover-val {
            min-width: 24px;
            text-align: right;
            font-weight: 600;
            color: #fff;
        }

        .color-choice-btn {
            height: 26px;
            padding: 0 9px;
            font-size: 0.72rem;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: #e4e4e7;
        }

        .color-choice-btn.active {
            background: #fff;
            color: #18181b;
            border-color: #fff;
            font-weight: 600;
        }

        .dock-divider {
            width: 1px;
            height: 18px;
            background: rgba(255,255,255,0.16);
            margin: 0 1px;
            flex-shrink: 0;
        }

        .dock-action-btn {
            height: 32px;
            padding: 0 11px;
            font-size: 0.76rem;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .dock-action-btn:hover {
            background: rgba(255,255,255,0.18);
        }

        .dock-action-btn.apply {
            background: var(--primary);
            border-color: var(--primary);
        }

        .dock-action-btn.apply:hover {
            background: #1d4ed8;
        }

        /* [5] MODALS */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(3px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .modal.active {
            display: flex;
        }

        #cameraModal {
            padding: 0;
        }

        .modal-box {
            background: var(--surface);
            padding: 18px;
            border-radius: 12px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.35);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-box.camera-box {
            width: min(1200px, 100vw);
            height: min(100dvh, 1000px);
            max-width: none;
            max-height: none;
            padding: 14px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .modal-header h4 {
            font-size: 0.98rem;
            font-weight: 600;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.84rem;
            background: #fafafa;
            color: var(--text);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 76px;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .key-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #dcfce7;
            color: #166534;
            cursor: pointer;
            display: none;
        }

        .key-badge.show {
            display: inline-block;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .video-container {
            position: relative;
            width: 100%;
            flex: 1;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        #cameraVideo {
            width: 100%;
            height: 100%;
            max-height: none;
            object-fit: contain;
            display: block;
            background: #000;
        }

        .camera-ratio-guide {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-ratio-guide::before {
            content: '';
            display: block;
            width: min(100%, calc(100dvh * var(--camera-ratio, 1.3333)));
            height: min(100%, calc(100dvh / var(--camera-ratio, 1.3333)));
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.32);
        }

        .camera-msg {
            position: absolute;
            color: #e4e4e7;
            font-size: 0.84rem;
            padding: 12px;
            text-align: center;
        }

        /* [6] GIAO DIỆN TỐI ƯU RIÊNG CHO ĐIỆN THOẠI */
        @media (max-width: 768px) {
            .modal-box.camera-box {
                width: 100vw;
                height: 100dvh;
                border-radius: 0;
                padding: 10px;
            }

            body {
                padding: 6px;
                gap: 6px;
                overflow-y: auto;
            }

            header {
                padding: 7px 10px;
                margin-bottom: 0;
            }

            header h1 {
                font-size: 0.9rem;
            }

            .header-actions {
                gap: 5px;
            }

            .header-actions button,
            .header-actions .btn-label {
                padding: 6px 9px;
                font-size: 0.78rem;
            }

            .btn-text-hide-mobile {
                display: none;
            }

            .main-layout {
                display: flex;
                flex-direction: column;
                gap: 6px;
                flex: 1;
            }

            /* Danh sách ảnh dạng dải thẻ ngang nhỏ gọn */
            .sidebar {
                flex-direction: row;
                align-items: center;
                padding: 4px 6px;
                flex-shrink: 0;
                height: 72px;
            }

            .sidebar-title {
                border-bottom: none;
                border-right: 1px solid var(--border);
                padding: 4px 8px 4px 2px;
                flex-direction: column;
                justify-content: center;
                font-size: 0.7rem;
                gap: 2px;
                min-width: 42px;
            }

            .page-list {
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 2px 4px;
                gap: 6px;
                align-items: center;
            }

            .page-item {
                flex-direction: column;
                padding: 3px;
                gap: 2px;
                width: 54px;
                border-radius: 6px;
            }

            .page-thumb-wrap {
                width: 100%;
                justify-content: center;
            }

            .page-index {
                position: absolute;
                top: 2px;
                left: 2px;
                background: rgba(24, 24, 27, 0.78);
                color: #fff;
                font-size: 0.6rem;
                width: 14px;
                height: 14px;
                line-height: 14px;
                border-radius: 3px;
            }

            .page-item img {
                width: 46px;
                height: 38px;
                object-fit: cover;
            }

            .page-actions {
                width: 100%;
                justify-content: space-between;
                gap: 0;
            }

            .icon-action {
                width: 15px;
                height: 15px;
            }

            .icon-action.btn-up svg,
            .icon-action.btn-down svg {
                transform: rotate(-90deg);
            }

            .icon-sm svg {
                width: 11px;
                height: 11px;
            }

            /* Vùng Image View luôn đảm bảo chiều cao */
            .preview-wrapper {
                flex: 1;
                min-height: 380px;
                height: calc(100dvh - 140px);
            }

            .viewport {
                flex: 1;
                min-height: 325px;
            }

            #editorCanvas {
                max-height: calc(100dvh - 210px);
            }

            /* Thanh điều khiển dưới đáy vừa vặn tuyệt đối, không làm tràn nút Original */
            .floating-dock {
                position: static;
                transform: none;
                width: 100%;
                max-width: 100%;
                border-radius: 0;
                border: none;
                border-top: 1px solid rgba(255,255,255,0.12);
                background: #18181b;
                padding: 6px 8px;
                gap: 4px;
                justify-content: space-between;
                box-shadow: none;
                flex-shrink: 0;
            }

            .dock-icon-btn {
                width: 32px;
                height: 32px;
                flex-shrink: 0;
            }

            .dock-icon-btn svg {
                width: 15px;
                height: 15px;
            }

            .dock-action-btn {
                flex: 1;
                min-width: 0;
                height: 32px;
                padding: 0 6px;
                font-size: 0.74rem;
                border-radius: 6px;
            }

            .dock-divider {
                margin: 0 1px;
                height: 18px;
            }

            /* Khung chỉnh sửa con (Popover) nhỏ gọn, tự co theo nội dung */
            .dock-popover {
                position: fixed;
                bottom: 52px;
                left: 50% !important;
                transform: translateX(-50%) !important;
                width: max-content;
                max-width: calc(100vw - 24px);
                padding: 5px 8px;
                border-radius: 8px;
            }

            .dock-popover .dock-icon-btn {
                width: 28px;
                height: 28px;
            }

            .dock-popover .dock-icon-btn svg {
                width: 14px;
                height: 14px;
            }

            .dock-popover::after {
                display: none;
            }

            .filter-sub-Row input[type="range"] {
                width: 115px;
            }

            .form-grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- [1] HEADER -->
    <header>
        <h1>📄 Document Scanner</h1>
        <div class="header-actions">
            <label for="fileInput" class="btn-label">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span class="btn-text-hide-mobile">Tải ảnh</span>
            </label>
            <input type="file" id="fileInput" accept="image/*" multiple>
            <input type="file" id="cameraCaptureInput" accept="image/*" capture="environment">

            <button id="btnOpenCamera">
                <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                <span class="btn-text-hide-mobile">Chụp ảnh</span>
            </button>

            <button id="btnOpenPDFModal" class="btn-dark">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 18 15 15"/></svg>
                <span>Xuất PDF</span>
            </button>
        </div>
    </header>

    <!-- [2] BỐ CỤC CHÍNH -->
    <div class="main-layout">

        <!-- DANH SÁCH TRANG -->
        <aside class="sidebar">
            <div class="sidebar-title">
                <span>Trang</span>
                <span id="pageCount">0</span>
            </div>
            <div id="pageList" class="page-list"></div>
        </aside>

        <!-- KHUNG PREVIEW & THANH ĐIỀU KHIỂN -->
        <main class="preview-wrapper">
            <div class="viewport" id="viewport">
                <div id="emptyState" class="empty-state">Tải ảnh lên hoặc bấm "Chụp ảnh" để bắt đầu</div>

                <div class="panzoom-stage" id="panzoomStage">
                    <canvas id="editorCanvas"></canvas>
                    <svg id="cropOverlaySvg">
                        <polygon id="cropPolygon" points="" fill="rgba(37, 99, 235, 0.18)" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,4"/>
                    </svg>
                    <div class="corner-handle" id="handle-tl" data-corner="tl"></div>
                    <div class="corner-handle" id="handle-tr" data-corner="tr"></div>
                    <div class="corner-handle" id="handle-br" data-corner="br"></div>
                    <div class="corner-handle" id="handle-bl" data-corner="bl"></div>
                </div>

                <!-- Thanh Zoom -->
                <div class="zoom-controls icon-sm">
                    <button id="btnZoomOut" title="Thu nhỏ">
                        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <span class="zoom-label" id="zoomLabel">100%</span>
                    <button id="btnZoomIn" title="Phóng to">
                        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <button id="btnZoomReset" title="Mặc định">
                        <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                    </button>
                </div>
            </div>

            <!-- THANH ĐIỀU KHIỂN ICON: Rotate | Crop | Filter | AI | Apply | Original -->
            <div class="floating-dock">

                <!-- 1. ROTATE ICON -->
                <div class="dock-item-group" id="groupRotate">
                    <button class="dock-icon-btn" id="btnToggleRotate" title="Rotate (Xoay & Lật)">
                        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><polyline points="21 3 21 8 16 8"/></svg>
                    </button>
                    <div class="dock-popover" id="popoverRotate">
                        <div class="popover-icon-row">
                            <button class="dock-icon-btn" id="btnRotateLeft" title="Xoay trái 90°">
                                <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                            </button>
                            <button class="dock-icon-btn" id="btnRotateRight" title="Xoay phải 90°">
                                <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                            </button>
                            <button class="dock-icon-btn" id="btnFlipH" title="Lật ngang">
                                <svg viewBox="0 0 24 24"><path d="m3 7 5 5-5 5V7"/><path d="m21 7-5 5 5 5V7"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                            </button>
                            <button class="dock-icon-btn" id="btnFlipV" title="Lật dọc">
                                <svg viewBox="0 0 24 24"><path d="m7 3 5 5 5-5H7"/><path d="m7 21 5-5 5 5H7"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 2. CROP ICON -->
                <button class="dock-icon-btn" id="btnToolCrop" title="Crop (Cắt & Trải phẳng 4 góc)">
                    <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
                </button>

                <!-- 3. FILTER ICON -->
                <div class="dock-item-group" id="groupFilter">
                    <button class="dock-icon-btn" id="btnToggleFilter" title="Filter (Độ sáng, Tương phản, Chế độ màu)">
                        <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                    </button>
                    <div class="dock-popover" id="popoverFilter">
                        <div class="popover-icon-row">
                            <button class="dock-icon-btn active" id="btnSubBrightness" title="Brightness (Độ sáng)">
                                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                            </button>
                            <button class="dock-icon-btn" id="btnSubContrast" title="Contrast (Tương phản)">
                                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></svg>
                            </button>
                            <button class="dock-icon-btn" id="btnSubColor" title="Chế độ màu (Gốc / Đen trắng)">
                                <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                            </button>
                        </div>

                        <div class="filter-sub-Row show" id="subRowBrightness">
                            <span>Sáng</span>
                            <input type="range" id="rangeBrightness" min="-100" max="100" step="1" value="0">
                            <span class="popover-val" id="valBrightness">0</span>
                        </div>

                        <div class="filter-sub-Row" id="subRowContrast">
                            <span>Tương phản</span>
                            <input type="range" id="rangeContrast" min="-100" max="100" step="1" value="0">
                            <span class="popover-val" id="valContrast">0</span>
                        </div>

                        <div class="filter-sub-Row" id="subRowColor">
                            <button class="color-choice-btn active" id="btnColorOriginal">Màu gốc</button>
                            <button class="color-choice-btn" id="btnColorBW">Đen trắng</button>
                        </div>
                    </div>
                </div>

                <!-- 4. AI ICON -->
                <button class="dock-icon-btn" id="btnToolAI" title="AI (Làm sạch ảnh bằng AI)">
                    <svg viewBox="0 0 24 24"><path d="m15 4-1 1 6 6 1-1a2.83 2.83 0 1 0-4-4Z"/><path d="m13 6-8.5 8.5a2.12 2.12 0 1 0 3 3L16 9"/><path d="M9 3v2M3 9h2M19 17v2M17 19h2"/></svg>
                </button>

                <div class="dock-divider"></div>

                <!-- Apply & Original -->
                <button class="dock-action-btn apply" id="btnApply">Apply</button>
                <button class="dock-action-btn" id="btnOriginal">Original</button>
            </div>
        </main>
    </div>

    <!-- [3] MODAL 1: XỬ LÝ AI -->
    <div class="modal" id="aiModal">
        <div class="modal-box">
            <div class="modal-header">
                <h4>✨ Xử lý tài liệu bằng AI</h4>
                <button class="icon-action" id="btnCloseAIModal">✕</button>
            </div>
            <div class="form-group">
                <label>
                    <span>OpenAI API Key</span>
                    <span id="keySavedBadge" class="key-badge" title="Nhấn để xóa Key khỏi trình duyệt">Đã lưu ✕</span>
                </label>
                <input type="password" id="openaiApiKey" placeholder="Nhập sk-... (Tự động lưu cho lần sau)">
            </div>
            <div class="form-group">
                <label>Yêu cầu xử lý (Prompt)</label>
                <textarea id="openaiPrompt" placeholder="Nhập yêu cầu xử lý ảnh...">Làm sạch nền giấy, khử bóng râm và tăng độ sắc nét cho trang tài liệu này.</textarea>
            </div>
            <div class="modal-footer">
                <button id="btnCancelAIModal">Hủy</button>
                <button id="btnRunAIImage" class="btn-primary">Chạy xử lý AI</button>
            </div>
        </div>
    </div>

    <!-- [4] MODAL 2: CẤU HÌNH & TẢI XUỐNG PDF -->
    <div class="modal" id="pdfModal">
        <div class="modal-box">
            <div class="modal-header">
                <h4>📄 Cấu hình & Tải xuống PDF</h4>
                <button class="icon-action" id="btnClosePDFModal">✕</button>
            </div>
            <div class="form-group">
                <label>Tên file PDF</label>
                <input type="text" id="pdfFileName" value="document.pdf" placeholder="document.pdf">
            </div>
            <div class="form-grid-2">
                <div class="form-group">
                    <label>Khổ trang giấy</label>
                    <select id="pdfFormat">
                        <option value="a4" selected>Chuẩn A4</option>
                        <option value="letter">Letter</option>
                        <option value="fit">Vừa khít kích thước ảnh</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Hướng trang</label>
                    <select id="pdfOrientation">
                        <option value="p" selected>Dọc (Portrait)</option>
                        <option value="l">Ngang (Landscape)</option>
                        <option value="auto">Tự động theo từng ảnh</option>
                    </select>
                </div>
            </div>
            <div class="form-grid-2">
                <div class="form-group">
                    <label>Căn lề trang</label>
                    <select id="pdfMargin">
                        <option value="0">Không lề (0 mm)</option>
                        <option value="8" selected>Lề vừa (8 mm)</option>
                        <option value="15">Lề rộng (15 mm)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Co giãn ảnh</label>
                    <select id="pdfScaleMode">
                        <option value="contain" selected>Giữ nguyên tỷ lệ</option>
                        <option value="fill">Kéo đầy khung giấy</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btnCancelPDFModal">Hủy</button>
                <button id="btnConfirmExportPDF" class="btn-dark">Tải xuống PDF</button>
            </div>
        </div>
    </div>

    <!-- [5] MODAL 3: CAMERA -->
    <div class="modal" id="cameraModal">
        <div class="modal-box camera-box">
            <div class="modal-header">
                <h4>📷 Chụp ảnh tài liệu</h4>
                <button class="icon-action" id="btnCloseCamera">✕</button>
            </div>
            <div class="video-container">
                <video id="cameraVideo" autoplay playsinline muted></video>
                <div class="camera-ratio-guide" id="cameraRatioGuide"></div>
                <div id="cameraStatusMsg" class="camera-msg">Đang xin quyền truy cập Camera...</div>
            </div>
            <div class="form-group camera-ratio-control">
                <label for="cameraAspectRatio">Tỉ lệ ảnh</label>
                <select id="cameraAspectRatio">
                    <option value="device" selected>Theo thiết bị (toàn bộ khung hình)</option>
                    <option value="1">1:1 (Vuông)</option>
                    <option value="1.333333">4:3</option>
                    <option value="0.75">3:4</option>
                    <option value="1.777778">16:9</option>
                    <option value="0.5625">9:16</option>
                </select>
            </div>
            <div class="modal-footer" style="justify-content: center;">
                <button id="btnSwitchCamera">Đổi Camera</button>
                <button id="btnCapturePhoto" class="btn-primary">Chụp ảnh</button>
            </div>
        </div>
    </div>

    <script src="convert_images_to_pdf.js"></script>
    <script src="javascripts.js"></script>
</body>
</html>
